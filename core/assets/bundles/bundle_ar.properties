host.info = يستضيف زر [accent]الاستضافة[] خادما على المنفذ المحدد.\nيجب أن يتمكن أي شخص على نفس [lightgray]شبكة الواي فاي أو الشبكة المحلية[] من رؤية خادمك في قائمة الخوادم لديه.\n\nإذا أردت أن يتمكن الناس من الاتصال من أي مكان عبر IP، فيلزم [accent]إعادة توجيه المنافذ[].\n\n[lightgray]ملاحظة: إذا واجه أحدهم مشكلة في الاتصال بلعبتك على الشبكة المحلية، تأكد من السماح لـ Mindustry بالوصول إلى شبكتك المحلية في إعدادات جدار الحماية. لاحظ أن الشبكات العامة لا تسمح أحيانا باكتشاف الخوادم.
