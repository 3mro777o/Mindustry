hint.payloadPickup = اضغط [accent][[[] لالتقاط المباني الصغيرة أو الوحدات.
hint.payloadPickup.mobile = [accent]المس مطولا[] مبنى صغيرا أو وحدة لالتقاطها.
hint.payloadDrop = اضغط [accent]][] لإسقاط الحمولة.
hint.payloadDrop.mobile = [accent]المس مطولا[] موقعا فارغا لإسقاط الحمولة هناك.
hint.waveFire = أبراج [accent]ويف[] التي تستخدم الماء كذخيرة تطفئ الحرائق القريبة تلقائيا.
hint.guardian = وحدات [accent]الحارس[] مدرعة. الذخيرة الضعيفة مثل [accent]النحاس[] و[accent]الرصاص[] [scarlet]غير فعالة[].\n\nاستخدم أبراجا أعلى مستوى أو ذخيرة :graphite: [accent]الغرافيت[] لأبراج :duo:دوو/:salvo:سالفو لإسقاط الحراس.
hint.coreUpgrade = يمكن ترقية النوى بـ[accent]وضع نوى أعلى مستوى فوقها[].\n\nضع نواة :core-foundation: [accent]الأساس[] فوق نواة :core-shard: [accent]الشظية[]. تأكد من خلوها من العوائق القريبة.
hint.serpuloCoreZone = يمكن بناء :core-shard: [accent]نوى[] إضافية على مربعات :core-zone: [accent]منطقة النواة[].
hint.cannotUpgrade = تشير أيقونة [red]:tree:[] فوق وحدة حمولة إلى أن نسختها المطورة لم تبحث بعد.\n\nيجب بحث ترقيات الوحدات في [accent]:tree: شجرة الأبحاث[] قبل أن تنتج في معيدات البناء.
hint.presetLaunch = يمكن الإطلاق إلى [accent]قطاعات مناطق الهبوط[] الرمادية، مثل [accent]الغابة المتجمدة[]، من أي مكان. فهي لا تتطلب الاستيلاء على الأراضي المجاورة.\n\n[accent]القطاعات المرقمة[]، مثل هذا القطاع، [accent]اختيارية[].
hint.presetDifficulty = هذا القطاع ذو [scarlet]مستوى تهديد عدو مرتفع[].\n[accent]لا ينصح[] بالإطلاق إلى مثل هذه القطاعات دون تقنية وتجهيز مناسبين.
hint.coreIncinerate = بعد امتلاء النواة بعنصر ما، سيتم [accent]حرق[] أي كمية إضافية تصلها من ذلك العنصر.
hint.factoryControl = لتحديد [accent]وجهة الإخراج[] لمصنع الوحدات، انقر على مبنى المصنع في وضع الأوامر، ثم انقر بالزر الأيمن على موقع.\nستتحرك الوحدات المنتجة إليه تلقائيا.
hint.factoryControl.mobile = لتحديد [accent]وجهة الإخراج[] لمصنع الوحدات، المس مبنى المصنع في وضع الأوامر، ثم المس موقعا.\nستتحرك الوحدات المنتجة إليه تلقائيا.
gz.mine = تحرك قرب :ore-copper: [accent]خام النحاس[] على الأرض وانقر لبدء التعدين.
gz.mine.mobile = تحرك قرب :ore-copper: [accent]خام النحاس[] على الأرض واضغط عليه لبدء التعدين.
gz.research = افتح :tree: شجرة الأبحاث.\nابحث عن :mechanical-drill: [accent]المثقاب الميكانيكي[]، ثم اختره من قائمة :production: في أسفل اليمين.\nانقر على رقعة نحاس لوضعه.
gz.research.mobile = افتح :tree: شجرة الأبحاث.\nابحث عن :mechanical-drill: [accent]المثقاب الميكانيكي[]، ثم اختره من قائمة :production: في أسفل اليمين.\nاضغط على رقعة نحاس لوضعه.\n\nاضغط على :ok: [accent]علامة الصح[] في أسفل اليمين للتأكيد.
gz.conveyors = ابحث عن :conveyor: [accent]النواقل[] وضعها لنقل الموارد المستخرجة\nمن المثاقب إلى النواة.\n\nانقر واسحب لوضع عدة نواقل.\n[accent]مرر عجلة الفأرة[] للتدوير.
gz.conveyors.mobile = ابحث عن :conveyor: [accent]النواقل[] وضعها لنقل الموارد المستخرجة\nمن المثاقب إلى النواة.\n\nاضغط بإصبعك لثانية واسحب لوضع عدة نواقل.
gz.drills = وسع عمليات التعدين.\nضع المزيد من المثاقب الميكانيكية.\nاستخرج 100 نحاس.
gz.lead = :lead: [accent]الرصاص[] مورد آخر شائع الاستخدام.\nأنشئ مثاقب لتعدين الرصاص.
gz.moveup = :up: تحرك للأعلى لمزيد من الأهداف.
gz.turrets = ابحث عن برج :duo: [accent]دوو[] وضع 2 منه للدفاع عن النواة.\nتحتاج أبراج دوو إلى :copper: [accent]الذخيرة[] من النواقل.
gz.duoammo = زود أبراج دوو بـ :copper: [accent]النحاس[] باستخدام النواقل.
gz.walls = [accent]الجدران[] تمنع الضرر القادم من الوصول إلى المباني.\nضع :copper-wall: [accent]جدرانا نحاسية[] حول الأبراج.
gz.defend = العدو قادم، استعد للدفاع.
gz.aa = لا يسهل إسقاط الوحدات الطائرة بالأبراج العادية.\nتوفر أبراج :scatter: [accent]سكاتر[] دفاعا جويا ممتازا، لكنها تحتاج إلى :lead: [accent]الرصاص[] ذخيرة.
gz.scatterammo = زود برج سكاتر بـ :lead: [accent]الرصاص[] باستخدام النواقل.
gz.supplyturret = [accent]زود البرج
gz.zone1 = هذه منطقة إنزال العدو.
gz.zone2 = يدمر أي شيء يبنى داخل هذا النطاق عند بدء الموجة.
gz.zone3 = ستبدأ موجة الآن.\nاستعد.
gz.finish = ابنِ المزيد من الأبراج، واستخرج المزيد من الموارد،\nودافع ضد جميع الموجات من أجل [accent]السيطرة على القطاع[].
ff.coal = استخدم :mechanical-drill: [accent]المثاقب الميكانيكية[] لتعدين :ore-coal: [accent]الفحم[].
ff.graphitepress = :tree: ابحث عن :graphite-press: [accent]مكبس الغرافيت[] ثم ضعه.
ff.craft = انقل :coal: الفحم إلى :graphite-press: [accent]مكبس الغرافيت[].\nسيخرج :graphite: الغرافيت إلى جميع النواقل القريبة.\nانقل :graphite: الغرافيت الناتج من :graphite-press: [accent]مكبس الغرافيت[] إلى النواة.
ff.generator = يمكن أيضا استخدام :coal: الفحم كوقود في :combustion-generator: [accent]مولدات الاحتراق[].\nابحث عن :combustion-generator: [accent]مولد الاحتراق[] ثم ضعه.
ff.coalpower = أدخل :coal: الفحم في المولد لإنتاج [accent]:power: الطاقة[].
ff.coalpower.objective = :combustion-generator: أنتج الطاقة
ff.node = :power-node: [accent]عقد الطاقة[] تنقل الطاقة إلى المباني القريبة ضمن المدى.\nابحث عن :power-node: [accent]عقدة الطاقة[] ثم ضعها قرب المولد.
ff.battery = :battery: [accent]البطاريات[] تخزن الطاقة.\nابحث عن :battery: [accent]البطارية[] ثم ضعها قرب العقدة.
ff.arc = أبراج :arc: [accent]آرك[] تحتاج إلى طاقة لتعمل. ابحث عن برج :arc: [accent]آرك[] ثم ضعه قرب عقدة طاقة.
fungalpass.tutorial1 = استخدم [accent]الوحدات[] للدفاع عن المباني ومهاجمة العدو.\nابحث عن :ground-factory: [accent]المصنع البري[] ثم ضعه.
fungalpass.tutorial2 = اختر وحدات :dagger: [accent]داغر[] في المصنع.\nأنتج 3 وحدات.
frontier.tutorial1 = :additive-reconstructor: [accent]معيد البناء الإضافي[]\nيرقي وحدات المستوى 1 إلى المستوى 2\nباستخدام :silicon: السيليكون و:graphite: الغرافيت.\n\n[accent]أعد بناء []:dagger:[accent] داغر\nإلى []:mace:[accent] ميس.
frontier.tutorial2 = تتوالى موجات العدو [accent]بلا نهاية[] حتى تصبح جميع نوى العدو [unlaunched]مدمرة.
frontier.tutorial3 = [accent]هاجم قاعدة العدو بسرعة لمنع الموجات من أن تصبح قوية جدا[].
atolls.destroy1 = دمر أولا [accent]نواتي الأساس[] التابعتين للعدو.\n[accent]احصل على الثوريوم[].
atolls.mega1 = ادخل [accent]وضع الأوامر[] وحدد وحدات :mega:[accent]ميغا[].
atolls.mega2 = اختر أمر  [accent]تحميل الوحدات[] لتلتقط وحدات ميغا الوحدات البرية.
atolls.mega3 = حرك وحدات ميغا [accent]فوق[] الوحدات البرية لتحميلها.
atolls.mega4 = [accent]أسقط الوحدات البرية هنا للهجوم.
atolls.mega5 = اختر أمر  [accent]تفريغ الحمولة[] لتسقط وحدات ميغا الوحدات التي تحملها.
atolls.mega6 = سيتم [accent]إسقاط الوحدات تلقائيا[] ما دام أمر  تفريغ الحمولة محددا.
atolls.mega7 = وحدات ميغا [accent]لن[] تسقط الوحدات البرية وهي فوق الجدران أو الماء العميق.
atolls.mega8 = [accent]أسقط الوحدات البحرية هنا للهجوم.[]
atolls.attack1 = 1: أسقط الوحدات البرية هنا للهجوم من هذا الموقع.
atolls.attack2 = 2: أو بدلا من ذلك، أسقط الوحدات البحرية هنا لشن هجوم مفاجئ.
atolls.carry1 = يتطلب حمل الوحدات البرية وحدات :mega:[accent]ميغا[].
atolls.carry2 = 1: وجه وحدات ميغا [accent]للتحرك فوق[] الوحدات البرية.
atolls.carry3 = 2: اختر أمر  [accent]تحميل الوحدات[] لتلتقط وحدات ميغا الوحدات البرية.
atolls.carry4 = 3: وجه حاملات ميغا [accent]المحملة بالوحدات[] وحركها.
atolls.carry5 = 4: اختر أمر  [accent]'تفريغ الحمولة'[] لتسقط وحدات ميغا الوحدات البرية.
atolls.carry6 = يمكن مراجعة هذه الخطوات [accent]هنا[].
atolls.carry7 = اتبع هذه التعليمات لإنزال المزيد من الوحدات جوا قرب قاعدة العدو.
atolls.noairunit = هذه القاعدة محصنة جيدا بحيث لا يمكن تدميرها بالوحدات الجوية.
atolls.2strategies = هناك استراتيجيتان لتدمير هذه القاعدة.
onset.mine = انقر لتعدين :beryllium: [accent]البيريليوم[] من الجدران.\n\nاستخدم [accent][[WASD] للتحرك.
onset.mine.mobile = المس لتعدين :beryllium: [accent]البيريليوم[] من الجدران.
onset.research = افتح شجرة الأبحاث :tree:.\nابحث ثم ضع :turbine-condenser: [accent]مكثف التوربين[] على الفتحة.\nسيولد هذا [accent]الطاقة[].
onset.bore = ابحث عن :plasma-bore: [accent]حفار البلازما[] ثم ضعه.\nيعدن الموارد من الجدران تلقائيا.
onset.power = لتزويد حفار البلازما بـ[accent]الطاقة[]، ابحث عن :beam-node: [accent]عقدة الشعاع[] ثم ضعها.\nصل مكثف التوربين بحفار البلازما.
onset.ducts = ابحث عن :duct: [accent]المجاري[] ثم ضعها لنقل الموارد المستخرجة من حفار البلازما إلى النواة.\nانقر واسحب لوضع أكثر من مجرى.\n[accent]مرر العجلة[] للتدوير.
onset.ducts.mobile = ابحث عن :duct: [accent]المجاري[] ثم ضعها لنقل الموارد المستخرجة من حفار البلازما إلى النواة.\n\nاضغط بإصبعك لثانية ثم اسحب لوضع أكثر من مجرى.
onset.moremine = وسع عملية التعدين.\nضع المزيد من حفارات البلازما واستخدم عقد الشعاع والمجاري لدعمها.\nاستخرج 200 بيريليوم.
onset.graphite = المباني الأكثر تعقيدا تحتاج إلى :graphite: [accent]الغرافيت[].\nجهز حفارات البلازما لتعدين الغرافيت.
onset.research2 = ابدأ بحث [accent]المصانع[].\nابحث عن :cliff-crusher: [accent]كسارة الجروف[] و:silicon-arc-furnace: [accent]فرن القوس السيليكوني[].
onset.arcfurnace = يحتاج فرن القوس إلى :sand: [accent]الرمل[] و:graphite: [accent]الغرافيت[] لصنع :silicon: [accent]السيليكون[].\nكما يتطلب [accent]الطاقة[].
onset.crusher = استخدم :cliff-crusher: [accent]كسارات الجروف[] لتعدين الرمل.
onset.fabricator = استخدم [accent]الوحدات[] لاستكشاف الخريطة والدفاع عن المباني ومهاجمة العدو. ابحث عن :tank-fabricator: [accent]مصنع الدبابات[] ثم ضعه.
onset.makeunit = أنتج وحدة.\nاستخدم زر "?" لمعرفة متطلبات المصنع المحدد.
onset.turrets = الوحدات فعالة، لكن [accent]الأبراج[] توفر قدرات دفاعية أفضل إذا استخدمت جيدا.\nضع برج :breach: [accent]بريتش[].\nتحتاج الأبراج إلى :beryllium: [accent]ذخيرة[].
onset.turretammo = زود البرج بـ[accent]البيريليوم[] كذخيرة باستخدام المجاري.
onset.walls = [accent]الجدران[] تمنع الضرر القادم من الوصول إلى المباني.\nضع بعض :beryllium-wall: [accent]جدران البيريليوم[] حول البرج.
onset.enemies = العدو قادم، استعد للدفاع.
onset.defenses = [accent]جهز الدفاعات:[lightgray] {0}
onset.attack = العدو ضعيف. شن هجوما مضادا.
onset.cores = يمكن وضع نوى جديدة على [accent]مربعات النواة[].\nتعمل النوى الجديدة كقواعد أمامية وتشارك مخزون الموارد مع النوى الأخرى.\nضع نواة :core-bastion:.
onset.detect = سيتمكن العدو من اكتشافك قريبا.\nجهز الدفاعات والتعدين والإنتاج.
onset.commandmode = اضغط مطولا على [accent]shift[] لدخول [accent]وضع الأوامر[].\n[accent]انقر بالزر الأيسر واسحب[] لتحديد الوحدات.\n[accent]انقر بالزر الأيمن[] لتأمر الوحدات المحددة بالتحرك أو الهجوم.
onset.commandmode.mobile = اضغط [accent]زر الأوامر[] لدخول [accent]وضع الأوامر[].\nاضغط بإصبعك ثم [accent]اسحب[] لتحديد الوحدات.\n[accent]المس[] لتأمر الوحدات المحددة بالتحرك أو الهجوم.
aegis.tungsten = يمكن تعدين التنغستن باستخدام [accent]مثقاب الاصطدام[].\nيتطلب هذا المبنى [accent]الماء[] و[accent]الطاقة[].
split.pickup = يمكن لوحدة النواة التقاط بعض المباني.\nحلق فوق هذه [accent]الحاوية[]، والتقطها وضعها على [accent]محمل الحمولة[].\n(المفاتيح الافتراضية هي [accent][[[] و[accent]][] للالتقاط والإسقاط)
split.pickup.mobile = يمكن لوحدة النواة التقاط بعض المباني.\nحلق فوق هذه [accent]الحاوية[]، والتقطها وضعها على [accent]محمل الحمولة[].\n(للالتقاط أو الإسقاط، اضغط مطولا على الهدف.)
split.acquire = احصل على بعض التنغستن لبناء الوحدات.
split.build = يجب نقل الوحدات إلى الجانب الآخر من الجدار.\nابحث عن :payload-mass-driver: [accent]مقذاف الحمولة[].\nضع [accent]مقذافي حمولة[]، واحدا على كل جانب من الجدار.\nأنشئ الرابط بالضغط على أحدهما ثم اختيار الآخر.
split.container = مثل الحاوية، يمكن أيضا نقل الوحدات باستخدام [accent]مقذاف الحمولة[].\nضع مصنع وحدات بجوار مقذاف الكتلة لتحميلها،\nثم أرسلها عبر الجدار لمهاجمة قاعدة العدو.
item.copper.description = يستخدم في جميع أنواع البناء والذخيرة.
item.copper.details = النحاس. معدن وفير بشكل غير طبيعي على سيربولو. ضعيف إنشائيا ما لم يعزز.
item.lead.description = يستخدم في نقل السوائل والمنشآت الكهربائية.
item.lead.details = كثيف. خامل. يستخدم على نطاق واسع في البطاريات.\nملاحظة: سام على الأرجح لأشكال الحياة البيولوجية؛ وإن لم يبق الكثير منها هنا.
item.metaglass.description = يستخدم في منشآت توزيع السوائل وتخزينها.
item.graphite.description = يستخدم في المكونات الكهربائية وذخيرة الأبراج.
item.sand.description = يستخدم في إنتاج مواد مكررة أخرى.
item.coal.description = يستخدم وقودا وفي إنتاج المواد المكررة.
item.coal.details = يبدو أنه مادة نباتية متحجرة، تكونت قبل حدث الزرع بزمن طويل.
item.titanium.description = يستخدم في منشآت نقل السوائل والمثاقب والمصانع.
item.thorium.description = يستخدم في المنشآت المتينة ووقودا نوويا.
item.scrap.description = يستخدم في المصاهر والساحقات لتكريره إلى مواد أخرى.
item.scrap.details = بقايا منشآت ووحدات قديمة.
item.silicon.description = يستخدم في الألواح الشمسية والإلكترونيات المعقدة وذخيرة الأبراج الموجهة.
item.plastanium.description = يستخدم في الوحدات المتقدمة والعزل والذخيرة المتشظية.
item.phase-fabric.description = يستخدم في الإلكترونيات المتقدمة والمنشآت ذاتية الإصلاح.
item.surge-alloy.description = تستخدم في الأسلحة المتقدمة ومنشآت الدفاع التفاعلية.
item.spore-pod.description = تستخدم للتحويل إلى نفط ومتفجرات ووقود.
item.spore-pod.details = أبواغ. على الأرجح شكل حياة اصطناعي. تطلق غازات سامة للحياة البيولوجية الأخرى. شديدة الانتشار. قابلة للاشتعال بشدة في ظروف معينة.
item.blast-compound.description = يستخدم في القنابل والذخيرة المتفجرة.
item.pyratite.description = يستخدم في الأسلحة الحارقة والمولدات العاملة بالاحتراق.
item.beryllium.description = يستخدم في أنواع عديدة من البناء والذخيرة على إيريكير.
item.tungsten.description = يستخدم في المثاقب والدروع والذخيرة. مطلوب لبناء المنشآت الأكثر تقدما.
item.oxide.description = يستخدم موصلا للحرارة وعازلا للطاقة.
item.carbide.description = يستخدم في المنشآت المتقدمة والوحدات الأثقل والذخيرة.
liquid.water.description = يستخدم لتبريد الآلات ومعالجة النفايات.
liquid.slag.description = يكرر في الفواصل إلى المعادن المكونة له. يستهلك في أبراج السوائل ذخيرة.
liquid.oil.description = يستخدم في إنتاج المواد المتقدمة وذخيرة حارقة.
liquid.cryofluid.description = يستخدم مبردا في المفاعلات والأبراج والمصانع.
liquid.arkycite.description = يستخدم في التفاعلات الكيميائية لتوليد الطاقة وتخليق المواد.
liquid.ozone.description = يستخدم وقودا وعاملا مؤكسدا في إنتاج المواد. متفجر بدرجة متوسطة.
liquid.hydrogen.description = يستخدم في استخراج الموارد وإنتاج الوحدات وإصلاح المنشآت. قابل للاشتعال.
liquid.cyanogen.description = يستخدم في الذخيرة وبناء الوحدات المتقدمة وتفاعلات متنوعة في المباني المتقدمة. شديد الاشتعال.
liquid.nitrogen.description = يستخدم في استخراج الموارد وإنتاج الغازات وإنتاج الوحدات. خامل.
liquid.neoplasm.description = ناتج ثانوي بيولوجي خطير من مفاعل النيوبلازيا. ينتشر بسرعة إلى أي مبنى مجاور يحتوي على الماء يلمسه، ملحقا به الضرر. لزج.
liquid.neoplasm.details = نيوبلازم. كتلة لا يمكن السيطرة عليها من خلايا اصطناعية سريعة الانقسام بقوام يشبه الوحل. مقاوم للحرارة. شديد الخطورة على أي منشآت تستخدم الماء.\n\nشديد التعقيد وعدم الاستقرار بحيث يتعذر تحليله قياسيا. تطبيقاته المحتملة مجهولة. يوصى بحرقه في برك الخبث.
block.derelict = \uF77E [lightgray]مهجور
block.armored-conveyor.description = ينقل العناصر إلى الأمام. لا يقبل المدخلات من الجوانب إلا من النواقل.
block.illuminator.description = يصدر الضوء.
block.message.description = يخزن رسالة للتواصل بين الحلفاء.
block.reinforced-message.description = يخزن رسالة للتواصل بين الحلفاء.
block.world-message.description = مبنى رسالة لاستخدامه في صناعة الخرائط. لا يمكن تدميره.
block.world-processor.description = معالج لاستخدامه في صناعة الخرائط. لا يمكن تدميره. قادر على استخدام تعليمات مميزة، مثل تلك التي تنشئ الوحدات أو تغير المربعات.
block.world-cell.description = خلية ذاكرة لاستخدامها في صناعة الخرائط. لا يمكن تدميرها.
block.world-switch.description = مبنى مفتاح لاستخدامه في صناعة الخرائط. لا يمكن تدميره. لا يتفاعل معه إلا لاعبو الفريق نفسه.
block.shield-projector.description = جهاز حاجز غير قابل للكسر لاستخدامه في صناعة الخرائط.
block.large-shield-projector.description = جهاز حاجز غير قابل للكسر لاستخدامه في صناعة الخرائط.
block.graphite-press.description = يضغط الفحم إلى غرافيت.
block.multi-press.description = يضغط الفحم إلى غرافيت. يحتاج إلى الماء مبردا.
block.silicon-smelter.description = يكرر السيليكون من الرمل والفحم.
block.kiln.description = يصهر الرمل والرصاص إلى زجاج معدني.
block.plastanium-compressor.description = ينتج البلاستانيوم من النفط والتيتانيوم.
block.phase-weaver.description = يخلق نسيج الطور من الثوريوم والرمل.
block.surge-smelter.description = يدمج التيتانيوم والرصاص والسيليكون والنحاس في سبيكة الاندفاع.
block.cryofluid-mixer.description = يخلط الماء ومسحوق التيتانيوم الناعم لإنتاج سائل التبريد.
block.blast-mixer.description = ينتج المركب المتفجر من البيراتيت وكبسولات الأبواغ.
block.pyratite-mixer.description = يخلط الفحم والرصاص والرمل لإنتاج البيراتيت.
block.melter.description = يذيب الخردة إلى خبث.
block.separator.description = يفصل الخبث إلى مكوناته المعدنية.
block.spore-press.description = يضغط كبسولات الأبواغ إلى نفط.
block.pulverizer.description = يسحق الخردة إلى رمل ناعم.
block.coal-centrifuge.description = يحول النفط إلى فحم.
block.incinerator.description = يبخر أي عنصر أو سائل يتلقاه.
block.power-void.description = يلغي كل الطاقة المدخلة. لوضع الحرية فقط.
block.power-source.description = يخرج طاقة بلا حدود. لوضع الحرية فقط.
block.item-source.description = يخرج عناصر بلا حدود. لوضع الحرية فقط.
block.item-void.description = يدمر العناصر المدخلة. لوضع الحرية فقط.
block.liquid-source.description = يخرج سوائل بلا حدود. لوضع الحرية فقط.
block.liquid-void.description = يدمر السوائل المدخلة. لوضع الحرية فقط.
block.payload-source.description = يخرج حمولات بلا حدود. لوضع الحرية فقط.
block.payload-void.description = يدمر أي حمولات. لوضع الحرية فقط.
block.copper-wall.description = يحمي المنشآت من مقذوفات العدو.
block.copper-wall-large.description = يحمي المنشآت من مقذوفات العدو.
block.titanium-wall.description = يحمي المنشآت من مقذوفات العدو.
block.titanium-wall-large.description = يحمي المنشآت من مقذوفات العدو.
block.plastanium-wall.description = يحمي المنشآت من مقذوفات العدو. يمتص أشعة الليزر والأقواس الكهربائية. يمنع توصيلات الطاقة التلقائية.
block.plastanium-wall-large.description = يحمي المنشآت من مقذوفات العدو. يمتص أشعة الليزر والأقواس الكهربائية. يمنع توصيلات الطاقة التلقائية.
block.thorium-wall.description = يحمي المنشآت من مقذوفات العدو.
block.thorium-wall-large.description = يحمي المنشآت من مقذوفات العدو.
block.phase-wall.description = يحمي المنشآت من مقذوفات العدو، ويعكس معظم الرصاصات عند الاصطدام.
block.phase-wall-large.description = يحمي المنشآت من مقذوفات العدو، ويعكس معظم الرصاصات عند الاصطدام.
block.surge-wall.description = يحمي المنشآت من مقذوفات العدو، ويطلق أقواسا كهربائية دوريا عند التلامس.
block.surge-wall-large.description = يحمي المنشآت من مقذوفات العدو، ويطلق أقواسا كهربائية دوريا عند التلامس.
block.scrap-wall.description = يحمي المنشآت من مقذوفات العدو.
block.scrap-wall-large.description = يحمي المنشآت من مقذوفات العدو.
block.scrap-wall-huge.description = يحمي المنشآت من مقذوفات العدو.
block.scrap-wall-gigantic.description = يحمي المنشآت من مقذوفات العدو.
block.door.description = جدار يمكن فتحه وإغلاقه.
block.door-large.description = جدار يمكن فتحه وإغلاقه.
block.mender.description = يصلح المباني القريبة منه كل فترة.\nيستخدم السيليكون اختياريا لزيادة المدى والكفاءة.
block.mend-projector.description = يصلح المباني المحيطة به.\nيستخدم نسيج الطور اختياريا لزيادة المدى والكفاءة.
block.overdrive-projector.description = يزيد سرعة المباني القريبة.\nيستخدم نسيج الطور اختياريا لزيادة المدى والكفاءة. لا يتراكم تأثيره.
block.force-projector.description = ينشئ حقل قوة سداسيا حوله، يحمي المباني والوحدات داخله من الضرر.\nترتفع حرارته إذا تلقى ضررا كبيرا. يستخدم المبرد اختياريا لمنع ارتفاع الحرارة. يزيد نسيج الطور حجم الدرع الواقي.
block.shock-mine.description = يطلق أقواسا كهربائية عند تلامس وحدة معادية معه.
block.conveyor.description = ينقل العناصر إلى الأمام.
block.titanium-conveyor.description = ينقل العناصر إلى الأمام. أسرع من الناقل العادي.
block.plastanium-conveyor.description = ينقل العناصر إلى الأمام على دفعات. يستقبل العناصر من الخلف، ويفرغها في ثلاثة اتجاهات من الأمام. يحتاج إلى عدة نقاط تحميل وتفريغ لتحقيق أقصى إنتاجية.
block.junction.description = يعمل جسرا بين حزامين ناقلين متقاطعين.
block.bridge-conveyor.description = ينقل العناصر فوق التضاريس أو المباني.
block.phase-conveyor.description = ينقل العناصر فورا فوق التضاريس أو المباني. مداه أطول من الجسر الناقل، لكنه يحتاج إلى الطاقة.
block.sorter.description = إذا طابق العنصر المدخل التحديد، يمر إلى الأمام. وإلا، يخرج العنصر إلى اليسار واليمين.
block.inverted-sorter.description = مشابه للفراز العادي، لكنه يخرج العناصر المحددة إلى الجانبين بدلا من ذلك.
block.router.description = يوزع العناصر الداخلة على اتجاهات الإخراج الأربعة بالتساوي.
block.router.details = شر لا بد منه. لا ينصح باستخدامه بجوار مدخلات الإنتاج، لأنها ستنسد بالمخرجات.
block.distributor.description = يوزع العناصر المدخلة على جميع اتجاهات الإخراج الـ 8 بالتساوي.
block.overflow-gate.description = لا يخرج العناصر إلى اليسار واليمين إلا إذا كان المسار الأمامي مسدودا.
block.underflow-gate.description = عكس بوابة الفائض. تخرج إلى الأمام إذا كان المساران الأيسر والأيمن مسدودين.
block.mass-driver.description = منشأة لنقل العناصر بعيد المدى. تجمع دفعات من العناصر وتقذفها إلى مقاذيف كتلة أخرى.
block.mechanical-pump.description = تضخ السوائل وتخرجها. لا تحتاج إلى الطاقة.
block.rotary-pump.description = تضخ السوائل وتخرجها. تحتاج إلى الطاقة.
block.impulse-pump.description = تضخ السوائل وتخرجها.
block.conduit.description = ينقل السوائل إلى الأمام. يستخدم مع المضخات والأنابيب الأخرى.
block.pulse-conduit.description = ينقل السوائل إلى الأمام. أسرع نقلا وأكبر سعة من الأنابيب العادية.
block.plated-conduit.description = ينقل السوائل إلى الأمام. لا يقبل المدخلات من الجوانب. لا يسرب.
block.liquid-router.description = يستقبل السوائل من اتجاه واحد ويخرجها إلى ما يصل إلى 3 اتجاهات أخرى بالتساوي. يمكنه أيضا تخزين كمية معينة من السائل.
block.liquid-container.description = تخزن كمية كبيرة نسبيا من السائل. تخرج إلى جميع الجوانب، مثل موزع السوائل.
block.liquid-tank.description = يخزن كمية كبيرة من السائل. يخرج إلى جميع الجوانب، مثل موزع السوائل.
block.liquid-junction.description = يعمل جسرا بين أنبوبين متقاطعين.
block.bridge-conduit.description = ينقل السوائل فوق التضاريس أو المباني.
block.phase-conduit.description = ينقل السوائل فوق التضاريس أو المباني. مداه أطول من جسر الأنابيب، لكنه يحتاج إلى الطاقة.
block.power-node.description = تنقل الطاقة إلى العقد المتصلة. تستقبل العقدة الطاقة من أي مبان مجاورة أو تزودها بها.
block.power-node-large.description = عقدة طاقة متقدمة ذات مدى أكبر.
block.surge-tower.description = عقدة طاقة بعيدة المدى بعدد أقل من التوصيلات المتاحة.
block.diode.description = ينقل طاقة البطاريات في اتجاه واحد، لكن فقط إذا كانت الطاقة المخزنة في الجانب الآخر أقل.
block.battery.description = تخزن الطاقة في أوقات الفائض. وتخرجها في أوقات العجز.
block.battery-large.description = تخزن الطاقة في أوقات الفائض. وتخرجها في أوقات العجز. سعتها أعلى من البطارية العادية.
block.combustion-generator.description = يولد الطاقة بحرق المواد القابلة للاشتعال، مثل الفحم.
block.thermal-generator.description = يولد الطاقة عند وضعه في المواقع الحارة.
block.steam-generator.description = يولد الطاقة بحرق المواد القابلة للاشتعال وتحويل الماء إلى بخار.
block.differential-generator.description = يولد كميات كبيرة من الطاقة. يستغل فرق الحرارة بين سائل التبريد والبيراتيت المحترق.
block.rtg-generator.description = يستخدم حرارة المركبات المشعة المتحللة لإنتاج الطاقة بمعدل بطيء.
block.solar-panel.description = يوفر كمية صغيرة من الطاقة من الشمس.
block.solar-panel-large.description = يوفر كمية صغيرة من الطاقة من الشمس. أكثر كفاءة من اللوح الشمسي العادي.
block.thorium-reactor.description = يولد كميات كبيرة من الطاقة من الثوريوم. يحتاج إلى تبريد مستمر. سينفجر بعنف إذا لم يزود بكميات كافية من المبرد.
block.impact-reactor.description = ينتج كميات هائلة من الطاقة عند أقصى كفاءة. يحتاج إلى مدخل طاقة كبير لبدء العملية.
block.mechanical-drill.description = عند وضعه على خام، يستخرج العناصر ببطء وبلا توقف. يستطيع تعدين الموارد الأساسية فقط.
block.pneumatic-drill.description = مثقاب محسن قادر على تعدين التيتانيوم. يعدن بسرعة أكبر من المثقاب الميكانيكي.
block.laser-drill.description = يتيح الحفر بسرعة أكبر بفضل تقنية الليزر، لكنه يحتاج إلى الطاقة. قادر على تعدين الثوريوم.
block.blast-drill.description = المثقاب الأقوى. يحتاج إلى كميات كبيرة من الطاقة.
block.water-extractor.description = يستخرج المياه الجوفية. يستخدم في المواقع التي لا تتوفر فيها مياه سطحية.
block.cultivator.description = تزرع التركيزات الضئيلة من الأبواغ الجوية لتحولها إلى كبسولات أبواغ.
block.cultivator.details = تقنية مستعادة. تستخدم لإنتاج كميات هائلة من الكتلة الحيوية بأعلى كفاءة ممكنة. على الأرجح الحاضنة الأولى للأبواغ التي تغطي سيربولو الآن.
block.oil-extractor.description = يستخدم كميات كبيرة من الطاقة والرمل والماء لاستخراج النفط.
block.core-shard.description = نواة القاعدة. إذا دمرت، تخسر القطاع.
block.core-shard.details = الإصدار الأول. مدمجة. ذاتية التكاثر. مزودة بدافعات إطلاق تستخدم مرة واحدة. غير مصممة للسفر بين الكواكب.
block.core-foundation.description = نواة القاعدة. مدرعة جيدا. تخزن موارد أكثر من الشظية.
block.core-foundation.details = الإصدار الثاني.
block.core-nucleus.description = نواة القاعدة. مدرعة بشدة. تخزن كميات هائلة من الموارد.
block.core-nucleus.details = الإصدار الثالث والأخير.
block.vault.description = تخزن كمية كبيرة من كل نوع من العناصر. توسع التخزين عند وضعها بجوار النواة. يمكن استرجاع محتوياتها بمفرغ.
block.container.description = تخزن كمية صغيرة من كل نوع من العناصر. توسع التخزين عند وضعها بجوار النواة. يمكن استرجاع محتوياتها بمفرغ.
block.unloader.description = يفرغ العناصر من المباني المجاورة في أي اتجاه.\nيمكن تصفية المخرجات لتفريغ عناصر محددة فقط.
block.launch-pad.description = تطلق دفعات من العناصر إلى القطاعات المحددة.
block.advanced-launch-pad.description = تطلق دفعات من العناصر إلى القطاعات المحددة. لا تقبل إلا نوعا واحدا من العناصر في كل مرة.
block.advanced-launch-pad.details = نظام شبه مداري لنقل الموارد من نقطة إلى نقطة.
block.landing-pad.description = تستقبل العناصر من منصات الإطلاق في القطاعات الأخرى. تحتاج إلى كميات كبيرة من الماء للحماية من صدمات الهبوط.
block.duo.description = يطلق رصاصات متناوبة على الأعداء.
block.scatter.description = يطلق كتلا من شظايا الرصاص أو الخردة أو الزجاج المعدني على طائرات العدو.
block.scorch.description = يحرق أي أعداء بريين قريبين منه. فعال جدا من مسافة قريبة.
block.hail.description = يطلق قذائف صغيرة على الأعداء البريين لمسافات بعيدة.
block.wave.description = يطلق تيارات من السائل على الأعداء. يطفئ الحرائق تلقائيا عند تزويده بالماء.
block.lancer.description = يشحن ويطلق أشعة طاقة قوية على الأهداف البرية.
block.arc.description = يطلق أقواسا كهربائية على الأهداف البرية.
block.swarmer.description = يطلق صواريخ موجهة على الأعداء.
block.salvo.description = يطلق رشقات سريعة من الرصاص على الأعداء.
block.fuse.description = يطلق ثلاث ضربات خارقة قصيرة المدى على الأعداء القريبين.
block.ripple.description = يطلق عناقيد من القذائف على الأعداء البريين لمسافات بعيدة.
block.cyclone.description = يطلق كتلا متفجرة من الشظايا على الأعداء القريبين.
block.spectre.description = يطلق رصاصات كبيرة على الأهداف الجوية والبرية.
block.meltdown.description = يشحن ويطلق شعاع ليزر مستمرا على الأعداء القريبين. يحتاج إلى مبرد ليعمل.
block.foreshadow.description = يطلق قذيفة كبيرة على هدف واحد لمسافات بعيدة. يعطي الأولوية للأعداء ذوي الصحة القصوى الأعلى.
block.repair-point.description = يصلح باستمرار أقرب وحدة متضررة في محيطه.
block.segment.description = يتلف المقذوفات القادمة ويدمرها. لا يستهدف مقذوفات الليزر.
block.parallax.description = يطلق شعاع جذب يسحب الأهداف الجوية ويلحق بها الضرر أثناء ذلك.
block.tsunami.description = يطلق تيارات قوية من السوائل على الأعداء. يطفئ الحرائق تلقائيا عند تزويده بالماء.
block.silicon-crucible.description = ينقي السيليكون من الرمل والفحم مستخدما البيراتيت مصدرا إضافيا للحرارة. أكثر كفاءة في المواقع الحارة.
block.disassembler.description = يفصل الخبث إلى كميات ضئيلة من مكونات معدنية نادرة بكفاءة منخفضة. يمكنه إنتاج الثوريوم.
block.overdrive-dome.description = يزيد سرعة المباني القريبة. يحتاج إلى نسيج الطور والسيليكون للعمل. لا يتراكم تأثيره.
block.payload-conveyor.description = ينقل الحمولات الكبيرة، مثل الوحدات الخارجة من المصانع.
block.payload-router.description = يقسم الحمولات الواردة إلى 3 اتجاهات إخراج. يعمل كفراز عند تعيين مرشح.
block.ground-factory.description = ينتج الوحدات البرية. يمكن استخدام الوحدات الناتجة مباشرة، أو نقلها إلى معيدات البناء لترقيتها.
block.air-factory.description = ينتج الوحدات الجوية. يمكن استخدام الوحدات الناتجة مباشرة، أو نقلها إلى معيدات البناء لترقيتها.
block.naval-factory.description = ينتج الوحدات البحرية. يمكن استخدام الوحدات الناتجة مباشرة، أو نقلها إلى معيدات البناء لترقيتها.
block.additive-reconstructor.description = يرقي الوحدات المدخلة إلى المستوى الثاني.
block.multiplicative-reconstructor.description = يرقي الوحدات المدخلة إلى المستوى الثالث.
block.exponential-reconstructor.description = يرقي الوحدات المدخلة إلى المستوى الرابع.
block.tetrative-reconstructor.description = يرقي الوحدات المدخلة إلى المستوى الخامس والأخير.
block.switch.description = مفتاح قابل للتبديل. يمكن قراءة حالته والتحكم بها عبر المعالجات المنطقية.
block.micro-processor.description = ينفذ سلسلة من التعليمات المنطقية في حلقة. يمكن استخدامه للتحكم في الوحدات والمباني.
block.logic-processor.description = ينفذ سلسلة من التعليمات المنطقية في حلقة. يمكن استخدامه للتحكم في الوحدات والمباني. أسرع من المعالج الدقيق.
block.hyper-processor.description = ينفذ سلسلة من التعليمات المنطقية في حلقة. يمكن استخدامه للتحكم في الوحدات والمباني. أسرع من المعالج المنطقي.
block.memory-cell.description = يخزن المعلومات لمعالج منطقي.
block.memory-bank.description = يخزن المعلومات لمعالج منطقي. سعة عالية.
block.logic-display.description = يعرض أي رسومات من معالج منطقي.
block.large-logic-display.description = يعرض أي رسومات من معالج منطقي.
block.tile-logic-display.description = يعرض أي رسومات من معالج منطقي.\nيتصل بسلاسة بالشاشات المبلطة المجاورة.
block.interplanetary-accelerator.description = برج مدفع كهرومغناطيسي ضخم. يسرع الأنوية إلى سرعة الإفلات للانتشار بين الكواكب.
block.repair-turret.description = يصلح باستمرار أقرب وحدة متضررة في محيطه. يقبل مبردا اختياريا.
block.target-dummy.name = دمية تدريب
block.target-dummy.description = ينشئ دمية تدريب لاختبار الضرر في الثانية. يمكن ضبط الدرع والطيران.\nفي وضع الحرية (Sandbox) فقط.
block.core-bastion.description = نواة القاعدة. مدرعة. إذا دمرت، تخسر القطاع.
block.core-citadel.description = نواة القاعدة. مدرعة جيدا جدا. تخزن موارد أكثر من نواة المعقل.
block.core-acropolis.description = نواة القاعدة. مدرعة بشكل استثنائي. تخزن موارد أكثر من نواة القلعة.
block.breach.description = يطلق رصاصات خارقة على أهداف العدو.
block.diffuse.description = يطلق دفعات من الرصاص في مخروط واسع. يدفع أهداف العدو إلى الخلف.
block.sublimate.description = يطلق نفاثة لهب مستمرة على أهداف العدو. يخترق الدروع.
block.titan.description = يطلق قذائف مدفعية متفجرة ضخمة على الأهداف البرية. يحتاج إلى الهيدروجين.
block.afflict.description = يطلق كرات مشحونة ضخمة من الشظايا المضادة للطائرات. يحتاج إلى التسخين.
block.disperse.description = يطلق دفعات من القذائف المضادة للطائرات على الأهداف الجوية.
block.lustre.description = يطلق ليزرا مستمرا بطيء الحركة على هدف واحد من أهداف العدو.
block.scathe.description = يطلق صواريخ قوية على الأهداف البرية عبر مسافات شاسعة.
block.smite.description = يطلق دفعات من الرصاصات الخارقة المطلقة للبرق.
block.malign.description = يطلق وابلا من شحنات الليزر الموجهة على أهداف العدو. يحتاج إلى تسخين كبير.
block.silicon-arc-furnace.description = ينقي السيليكون من الرمل والغرافيت.
block.oxidation-chamber.description = يحول البيريليوم والأوزون إلى أكسيد. يطلق الحرارة كناتج ثانوي.
block.electric-heater.description = يمد المنشآت بالحرارة. يحتاج إلى كميات كبيرة من الطاقة.
block.slag-heater.description = يمد المنشآت بالحرارة. يحتاج إلى الخبث.
block.phase-heater.description = يمد المنشآت بالحرارة. يحتاج إلى نسيج الطور.
block.heat-redirector.description = يعيد توجيه الحرارة المتراكمة إلى مبان أخرى.
block.small-heat-redirector.description = يعيد توجيه الحرارة المتراكمة إلى مبان أخرى.
block.heat-router.description = يوزع الحرارة المتراكمة في ثلاثة اتجاهات إخراج.
block.electrolyzer.description = يحلل الماء إلى غازي الهيدروجين والأوزون. يخرج الغازات الناتجة في اتجاهين متعاكسين، معلمين بالألوان المقابلة.
block.atmospheric-concentrator.description = يركز النيتروجين من الغلاف الجوي. يحتاج إلى الحرارة.
block.surge-crucible.description = يصنع سبيكة الاندفاع من السيليكون والمعادن الموجودة في الخبث. يحتاج إلى الحرارة.
block.phase-synthesizer.description = يصنع نسيج الطور من الثوريوم والرمل والأوزون. يحتاج إلى الحرارة.
block.carbide-crucible.description = يدمج الغرافيت والتنغستن لتكوين الكاربيد. يحتاج إلى الحرارة.
block.cyanogen-synthesizer.description = يصنع السيانوجين من الأركيسايت والغرافيت. يحتاج إلى الحرارة.
block.slag-incinerator.description = يحرق العناصر أو السوائل غير المتطايرة. يحتاج إلى الخبث.
block.vent-condenser.description = يكثف غازات الفتحات إلى ماء. يستهلك الطاقة.
block.plasma-bore.description = عند وضعه مواجها لجدار خام، يخرج العناصر بلا توقف. يحتاج إلى كميات صغيرة من الطاقة.\nيستخدم الهيدروجين اختياريا لزيادة الكفاءة.
block.large-plasma-bore.description = حفار بلازما أكبر. قادر على تعدين التنغستن والثوريوم. يحتاج إلى الهيدروجين والطاقة.\nيستخدم النيتروجين اختياريا لزيادة الكفاءة.
block.cliff-crusher.description = يسحق الجدران ويخرج الرمل بلا توقف. يحتاج إلى الطاقة. تختلف الكفاءة حسب نوع الجدار.
block.large-cliff-crusher.description = يسحق الجدران ويخرج الرمل بلا توقف. يحتاج إلى الطاقة والهيدروجين. تختلف الكفاءة حسب نوع الجدار. يستهلك الغرافيت اختياريا لزيادة الكفاءة.
block.impact-drill.description = عند وضعه على الخام، يخرج العناصر على دفعات بلا توقف. يحتاج إلى الطاقة والماء.\nيستخدم الأوزون اختياريا لزيادة الكفاءة.
block.eruption-drill.description = مثقاب اصطدام محسن. قادر على تعدين الثوريوم. يحتاج إلى الهيدروجين.\nيستخدم السيانوجين اختياريا لزيادة الكفاءة.
block.reinforced-conduit.description = ينقل السوائل إلى الأمام. لا يقبل مدخلات جانبية من غير الأنابيب.
block.reinforced-liquid-router.description = يوزع السوائل بالتساوي على جميع الجوانب.
block.reinforced-liquid-tank.description = يخزن كمية كبيرة من السوائل.
block.reinforced-liquid-container.description = يخزن كمية معتبرة من السوائل.
block.reinforced-bridge-conduit.description = ينقل السوائل فوق المنشآت والتضاريس.
block.reinforced-pump.description = يضخ السوائل ويخرجها. يحتاج إلى الهيدروجين.
block.beryllium-wall.description = يحمي المنشآت من مقذوفات العدو.
block.beryllium-wall-large.description = يحمي المنشآت من مقذوفات العدو.
block.tungsten-wall.description = يحمي المنشآت من مقذوفات العدو.
block.tungsten-wall-large.description = يحمي المنشآت من مقذوفات العدو.
block.carbide-wall.description = يحمي المنشآت من مقذوفات العدو.
block.carbide-wall-large.description = يحمي المنشآت من مقذوفات العدو.
block.reinforced-surge-wall.description = يحمي المنشآت من مقذوفات العدو، ويطلق أقواسا كهربائية دوريا عند التلامس.
block.reinforced-surge-wall-large.description = يحمي المنشآت من مقذوفات العدو، ويطلق أقواسا كهربائية دوريا عند التلامس.
block.shielded-wall.description = يحمي المنشآت من مقذوفات العدو، ويعكس معظم الرصاص عند الاصطدام. ينشر درعا واقيا يمتص معظم المقذوفات عند تزويده بالطاقة. ينقل الطاقة.
block.blast-door.description = جدار ينفتح عندما تكون الوحدات البرية الحليفة ضمن المدى. لا يمكن التحكم به يدويا.
block.duct.description = ينقل العناصر إلى الأمام. لا يخزن سوى عنصر واحد.
block.armored-duct.description = ينقل العناصر إلى الأمام. لا يقبل مدخلات جانبية من غير المجاري.
block.duct-router.description = يوزع العناصر بالتساوي في ثلاثة اتجاهات. يقبل العناصر من الجهة الخلفية فقط. يمكن ضبطه كفراز عناصر.
block.overflow-duct.description = يخرج العناصر إلى الجانبين فقط إذا كان المسار الأمامي مسدودا.
block.duct-bridge.description = ينقل العناصر فوق المنشآت والتضاريس.
block.duct-unloader.description = يفرغ العنصر المحدد من المبنى الذي خلفه. لا يمكنه التفريغ من الأنوية.
block.underflow-duct.description = عكس مجرى الفائض. يخرج إلى الأمام إذا كان المساران الأيسر والأيمن مسدودين.
block.reinforced-liquid-junction.description = يعمل كتقاطع بين أنبوبين متقاطعين.
block.surge-conveyor.description = ينقل العناصر على دفعات. يمكن تسريعه بالطاقة. ينقل الطاقة.
block.surge-router.description = يوزع العناصر بالتساوي في ثلاثة اتجاهات من نواقل الاندفاع. يمكن تسريعه بالطاقة. ينقل الطاقة.
block.unit-cargo-loader.description = يصنع طائرات شحن مسيرة. توزع الطائرات العناصر تلقائيا إلى نقاط تفريغ الشحن ذات المرشح المطابق.
block.unit-cargo-unload-point.description = يعمل كنقطة تفريغ لطائرات الشحن المسيرة. يقبل العناصر المطابقة للمرشح المحدد.
block.beam-node.description = ينقل الطاقة إلى المباني الأخرى بشكل متعامد. يخزن كمية صغيرة من الطاقة.
block.beam-tower.description = ينقل الطاقة إلى المباني الأخرى بشكل متعامد. يخزن كمية كبيرة من الطاقة. بعيد المدى.
block.beam-link.description = ينقل الطاقة عبر مسافات شاسعة.\nلا يمكنه الاتصال إلا بالمنشآت المجاورة أو روابط شعاع أخرى.
block.turbine-condenser.description = يولد الطاقة عند وضعه على الفتحات. ينتج كمية صغيرة من الماء.
block.chemical-combustion-chamber.description = يولد الطاقة من الأركيسايت والأوزون.
block.pyrolysis-generator.description = يولد كميات كبيرة من الطاقة من الأركيسايت والخبث. ينتج الماء كناتج ثانوي.
block.flux-reactor.description = يولد كميات كبيرة من الطاقة عند تسخينه. يحتاج إلى السيانوجين كمثبت. يتناسب إنتاج الطاقة واحتياج السيانوجين مع الحرارة المدخلة.\nينفجر إذا لم يزود بما يكفي من السيانوجين.
block.neoplasia-reactor.description = يستخدم الأركيسايت والماء ونسيج الطور لتوليد كميات كبيرة من الطاقة. ينتج الحرارة والنيوبلازم الخطير كناتج ثانوي.\nينفجر بعنف إذا لم يزل النيوبلازم من المفاعل عبر الأنابيب.
block.build-tower.description = يعيد بناء المنشآت ضمن مداه تلقائيا ويساعد الوحدات الأخرى في البناء.
block.regen-projector.description = يصلح المنشآت الحليفة ببطء ضمن محيط مربع. يحتاج إلى الهيدروجين.\nيستخدم نسيج الطور اختياريا لزيادة الكفاءة.
block.reinforced-container.description = يخزن كمية صغيرة من العناصر. يمكن استرداد المحتويات عبر المفرغات. لا يزيد سعة تخزين النواة.
block.reinforced-vault.description = يخزن كمية كبيرة من العناصر. يمكن استرداد المحتويات عبر المفرغات. لا يزيد سعة تخزين النواة.
block.tank-fabricator.description = يصنع وحدات ستيل. يمكن استخدام الوحدات الناتجة مباشرة، أو نقلها إلى معيدات التصنيع لترقيتها.
block.ship-fabricator.description = يصنع وحدات إيلود. يمكن استخدام الوحدات الناتجة مباشرة، أو نقلها إلى معيدات التصنيع لترقيتها.
block.mech-fabricator.description = يصنع وحدات ميروي. يمكن استخدام الوحدات الناتجة مباشرة، أو نقلها إلى معيدات التصنيع لترقيتها.
block.tank-assembler.description = يجمع دبابات كبيرة من المباني والوحدات المدخلة. يمكن رفع مستوى الناتج بإضافة وحدات تجميع.
block.ship-assembler.description = يجمع سفنا كبيرة من المباني والوحدات المدخلة. يمكن رفع مستوى الناتج بإضافة وحدات تجميع.
block.mech-assembler.description = يجمع آليات كبيرة من المباني والوحدات المدخلة. يمكن رفع مستوى الناتج بإضافة وحدات تجميع.
block.tank-refabricator.description = يرقي وحدات الدبابات المدخلة إلى المستوى الثاني.
block.ship-refabricator.description = يرقي وحدات السفن المدخلة إلى المستوى الثاني.
block.mech-refabricator.description = يرقي وحدات الآليات المدخلة إلى المستوى الثاني.
block.prime-refabricator.description = يرقي الوحدات المدخلة إلى المستوى الثالث.
block.basic-assembler-module.description = يرفع مستوى المجمع عند وضعه بجوار حدود البناء. يحتاج إلى الطاقة. يمكن استخدامه كمدخل للحمولة.
block.small-deconstructor.description = يفكك المنشآت والوحدات المدخلة. يعيد 100% من تكلفة البناء. يحفظ العناصر في سعات تخزين منفصلة.
block.reinforced-payload-conveyor.description = ينقل الحمولات إلى الأمام.
block.reinforced-payload-router.description = يوزع الحمولات على المباني المجاورة. يعمل كفراز عند تعيين مرشح.
block.payload-mass-driver.description = منشأة نقل حمولات بعيدة المدى. تقذف الحمولات المستلمة إلى مقاذيف الحمولة المرتبطة.
block.large-payload-mass-driver.description = منشأة نقل حمولات بعيدة المدى. تقذف الحمولات المستلمة إلى مقاذيف الحمولة المرتبطة.
block.unit-repair-tower.description = يصلح جميع الوحدات في محيطه. يحتاج إلى الأوزون.
block.radar.description = يكشف التضاريس ووحدات العدو تدريجيا ضمن نطاق واسع. يحتاج إلى الطاقة.
block.shockwave-tower.description = يتلف مقذوفات العدو ويدمرها ضمن نطاق محدد. يحتاج إلى السيانوجين.
block.canvas.description = يعرض صورة بسيطة بلوحة ألوان محددة مسبقا. قابلة للتعديل.
block.large-canvas.description = يعرض صورة بسيطة بلوحة ألوان محددة مسبقا. قابلة للتعديل.
unit.dagger.description = يطلق رصاصات عادية على أهداف العدو.
unit.mace.description = يطلق تيارات من اللهب على أهداف العدو.
unit.fortress.description = يطلق مدفعية بعيدة المدى على الأهداف البرية للعدو.
unit.scepter.description = يطلق وابلا من الرصاصات المشحونة على أهداف العدو.
unit.reign.description = يطلق وابلا من الرصاصات الخارقة الضخمة على أهداف العدو.
unit.nova.description = يطلق ومضات ليزر تلحق الضرر بأهداف العدو وتصلح المنشآت الحليفة. قادر على الطيران.
unit.pulsar.description = يطلق أقواسا كهربائية تلحق الضرر بأهداف العدو وتصلح المنشآت الحليفة. قادر على الطيران.
unit.quasar.description = يطلق أشعة ليزر خارقة تلحق الضرر بأهداف العدو وتصلح المنشآت الحليفة. قادر على الطيران. محمي بدرع واق.
unit.vela.description = يطلق شعاع ليزر مستمرا ضخما يلحق الضرر بأهداف العدو ويشعل الحرائق ويصلح المنشآت الحليفة. قادر على الطيران.
unit.corvus.description = يطلق انفجار ليزر ضخما يلحق الضرر بأهداف العدو ويصلح المنشآت الحليفة. يستطيع تخطي معظم التضاريس.
unit.crawler.description = يتحرك نحو أهداف العدو ويدمر نفسه، مسببا انفجارا كبيرا.
unit.atrax.description = يطلق كرات خبث معيقة على الأهداف البرية. يستطيع تخطي معظم التضاريس.
unit.spiroct.description = يطلق أشعة ليزر مستنزفة على أهداف العدو، فيصلح نفسه أثناء ذلك. يستطيع تخطي معظم التضاريس.
unit.arkyid.description = يطلق أشعة ليزر مستنزفة كبيرة على أهداف العدو، فيصلح نفسه أثناء ذلك. يستطيع تخطي معظم التضاريس.
unit.toxopid.description = يطلق قذائف عنقودية كهربائية كبيرة وأشعة ليزر خارقة على أهداف العدو. يستطيع تخطي معظم التضاريس.
unit.flare.description = يطلق رصاصات عادية على الأهداف البرية للعدو.
unit.horizon.description = يلقي عناقيد من القنابل على الأهداف البرية للعدو.
unit.zenith.description = يطلق رشقات من الصواريخ على أهداف العدو.
unit.antumbra.description = يطلق وابلا من الرصاص على أهداف العدو.
unit.eclipse.description = يطلق شعاعي ليزر خارقين ووابلا من القذائف المضادة للطائرات على أهداف العدو.
unit.mono.description = يعدن النحاس والرصاص تلقائيا ويودعهما في النواة.
unit.poly.description = يعيد بناء المنشآت المدمرة تلقائيا ويساعد الوحدات الأخرى في البناء.
unit.mega.description = يصلح المنشآت المتضررة تلقائيا. قادر على حمل المباني والوحدات البرية الصغيرة.
unit.quad.description = يلقي قنابل بلازما على الأهداف البرية، فيصلح المنشآت الحليفة ويلحق الضرر بالأهداف البرية للعدو. قادر على حمل الوحدات البرية متوسطة الحجم.
unit.oct.description = يحمي الحلفاء القريبين بدرع واق متجدد. قادر على حمل معظم الوحدات البرية.
unit.risso.description = يطلق وابلا من الصواريخ والرصاص على أهداف العدو.
unit.minke.description = يطلق قذائف ورصاصات عادية على الأهداف البرية للعدو.
unit.bryde.description = يطلق قذائف مدفعية بعيدة المدى وصواريخ على أهداف العدو.
unit.sei.description = يطلق وابلا من الصواريخ والرصاصات الخارقة للدروع على أهداف العدو.
unit.omura.description = يطلق قذيفة مدفع كهرومغناطيسي خارقة بعيدة المدى على أهداف العدو.
unit.alpha.description = يدافع عن نواة الشظية ضد الأعداء. يبني المنشآت.
unit.beta.description = يدافع عن نواة الأساس ضد الأعداء. يبني المنشآت.
unit.gamma.description = يدافع عن نواة النيوكليوس ضد الأعداء. يبني المنشآت.
unit.retusa.description = يطلق طوربيدات موجهة على أهداف العدو. يصلح الوحدات الحليفة.
unit.oxynoe.description = يطلق تيارات لهب تصلح المنشآت على أهداف العدو. يستهدف مقذوفات العدو ببرج دفاع نقطي.
unit.cyerce.description = يطلق صواريخ عنقودية باحثة على أهداف العدو. يصلح الوحدات الحليفة.
unit.aegires.description = يصعق جميع وحدات العدو ومنشآته التي تدخل مجال طاقته. يصلح جميع الحلفاء.
unit.navanax.description = يطلق مقذوفات EMP متفجرة تلحق ضررا كبيرا بشبكات طاقة العدو وتصلح المنشآت الحليفة. يذيب أهداف العدو بـ 4 أبراج ليزر ذاتية التشغيل.
unit.stell.description = يطلق رصاصات عادية على أهداف العدو.
unit.locus.description = يطلق رصاصات متناوبة على أهداف العدو.
unit.precept.description = يطلق رصاصات عنقودية خارقة على أهداف العدو. أقل تأثرا بمقاومة السوائل
unit.vanquish.description = يطلق رصاصات خارقة متشظية كبيرة على أهداف العدو. أقل تأثرا بمقاومة السوائل.
unit.conquer.description = يطلق سيولا كبيرة من الرصاصات الخارقة على أهداف العدو. أقل تأثرا بمقاومة السوائل بشكل ملحوظ.
unit.merui.description = يطلق مدفعية بعيدة المدى على الأهداف البرية للعدو. يستطيع تخطي معظم التضاريس.
unit.cleroi.description = يطلق قذائف مزدوجة على أهداف العدو. يستهدف مقذوفات العدو بأبراج دفاع نقطي. يستطيع تخطي معظم التضاريس.
unit.anthicus.description = يطلق صواريخ موجهة بعيدة المدى على أهداف العدو. يستطيع تخطي معظم التضاريس.
unit.tecta.description = يطلق صواريخ بلازما موجهة على أهداف العدو. يحمي نفسه بدرع واق اتجاهي. يستطيع تخطي معظم التضاريس.
unit.collaris.description = يطلق مدفعية متشظية بعيدة المدى على أهداف العدو. يستطيع تخطي معظم التضاريس.
unit.elude.description = يطلق أزواجا من الرصاصات الموجهة على أهداف العدو. يستطيع الطفو فوق المسطحات السائلة.
unit.avert.description = يطلق أزواجا ملتوية من الرصاص على أهداف العدو.
unit.obviate.description = يطلق أزواجا ملتوية من كرات البرق على أهداف العدو.
unit.quell.description = يطلق صواريخ موجهة بعيدة المدى مزودة بدرع بلازما غير مستقر على أهداف العدو. يثبط مباني إصلاح المنشآت لدى العدو. يهاجم الأهداف البرية فقط.
unit.disrupt.description = يطلق صواريخ تثبيط موجهة بعيدة المدى على أهداف العدو. يثبط مباني إصلاح المنشآت لدى العدو. يهاجم الأهداف البرية فقط.
unit.evoke.description = يبني المنشآت للدفاع عن نواة المعقل. يصلح المنشآت بشعاع. قادر على حمل منشآت 2x2.
unit.incite.description = يبني المنشآت للدفاع عن نواة القلعة. يصلح المنشآت بشعاع. قادر على حمل منشآت 2x2.
unit.emanate.description = يبني المنشآت للدفاع عن نواة الأكروبوليس. يصلح المنشآت بأشعة. قادر على حمل منشآت 2x2.
lst.read = يقرأ رقما من خلية ذاكرة مرتبطة.\nيمكنه أيضا القراءة من المتغيرات في معالجات أخرى.
lst.write = يكتب رقما إلى خلية ذاكرة مرتبطة.\nيمكنه أيضا الكتابة إلى المتغيرات في معالجات أخرى.
lst.print = يضيف نصا إلى مخزن الطباعة.\nلا يعرض أي شيء حتى يتم استخدام [accent]Print Flush[].
lst.printchar = يضيف حرف UTF-16 أو أيقونة محتوى إلى مخزن الطباعة.\nلا يعرض أي شيء حتى يتم استخدام [accent]Print Flush[].
lst.format = يستبدل العنصر النائب التالي في مخزن النص بقيمة.\nلا يفعل شيئا إذا كان نمط العنصر النائب غير صالح.\nنمط العنصر النائب: "{[accent]رقم 0-9[]}"\nمثال:\n[accent]print "test {0}"\nformat "example"
lst.draw = يضيف عملية إلى مخزن الرسم.\nلا يعرض أي شيء حتى يتم استخدام [accent]Draw Flush[].
lst.drawflush = يرسل عمليات [accent]Draw[] المنتظرة إلى شاشة.
lst.printflush = يرسل عمليات [accent]Print[] المنتظرة إلى مبنى رسالة.
lst.getlink = يحصل على رابط معالج حسب الفهرس. يبدأ من 0.
lst.control = يتحكم في مبنى.
lst.radar = يحدد مواقع الوحدات حول مبنى ذي مدى.
lst.sensor = يحصل على بيانات من مبنى أو وحدة.
lst.set = يعين متغيرا.
lst.operation = ينفذ عملية على متغير أو متغيرين.
lst.select = يعين متغيرا إلى إحدى قيمتين حسب شرط.
lst.end = يقفز إلى أعلى مكدس التعليمات.
lst.wait = ينتظر عددا محددا من الثواني.
lst.stop = يوقف تنفيذ هذا المعالج.
lst.lookup = يبحث عن نوع عنصر/سائل/وحدة/مبنى حسب المعرف.\nيمكن الوصول إلى العدد الإجمالي لكل نوع عبر:\n[accent]@unitCount[] / [accent]@itemCount[] / [accent]@liquidCount[] / [accent]@blockCount[]\nللعملية العكسية، استشعر [accent]@id[] للكائن.
lst.jump = يقفز إلى تعليمة أخرى حسب شرط.
lst.unitbind = يرتبط بالوحدة التالية من نوع معين، ويخزنها في [accent]@unit[].
lst.unitcontrol = يتحكم في الوحدة المرتبطة حاليا.
lst.unitradar = يحدد مواقع الوحدات حول الوحدة المرتبطة حاليا.
lst.unitlocate = يحدد موقع نوع معين من المواقع/المباني في أي مكان على الخريطة.\nيتطلب وحدة مرتبطة.
lst.getblock = يحصل على بيانات المربع في أي موقع.
lst.setblock = يعين بيانات المربع في أي موقع.
lst.spawnunit = ينشئ وحدة في موقع ما.
lst.spawnbullet = ينشئ رصاصة في موقع ما.
lst.applystatus = يطبق تأثير حالة على وحدة أو يزيله.
lst.weathersense = يتحقق مما إذا كان نوع معين من الطقس نشطا.
lst.weatherset = يعين الحالة الحالية لنوع معين من الطقس.
lst.spawnwave = ينشئ موجة.
lst.explosion = ينشئ انفجارا في موقع ما.
lst.setrate = يعين سرعة تنفيذ المعالج بالتعليمات/النبضة.\nلا يمكن تجاوز سرعة التنفيذ القصوى.
lst.fetch = يبحث عن الوحدات أو الأنوية أو اللاعبين أو المباني حسب الفهرس.\nتبدأ الفهارس من 0 وتنتهي عند العدد المعاد.
lst.packcolor = يحزم مكونات RGBA ضمن [0, 1] في رقم واحد للرسم أو لتعيين القواعد.
lst.unpackcolor = يفك مكونات RGBA من لون تم حزمه باستخدام Pack Color.
lst.setrule = يعين قاعدة لعب.
lst.flushmessage = يعرض رسالة على الشاشة من مخزن النص.\nإذا كان متغير نتيجة النجاح هو [accent]@wait[]،\nفسينتظر حتى تنتهي الرسالة السابقة.\nوإلا، فإنه يخرج ما إذا كان عرض الرسالة قد نجح.
lst.cutscene = يتحكم في كاميرا اللاعب.
lst.setflag = يعين علامة عامة يمكن لجميع المعالجات قراءتها.
lst.getflag = يتحقق مما إذا تم تعيين علامة عامة.
lst.setprop = يعين خاصية لوحدة أو مبنى.
lst.effect = ينشئ تأثير جسيمات.
lst.sync = يزامن متغيرا عبر الشبكة.\nمحدود بـ 20 مرة في الثانية لكل متغير.
lst.playsound = يشغل صوتا.\nيمكن أن يكون كل من مستوى الصوت والتوزيع الصوتي قيمة عامة، أو أن يحسب بناء على الموقع.
lst.playmusic = يشغل مقطعا موسيقيا بالاسم، مثل [accent]\"game1\"[].\nإذا كانت قيمة [accent]interrupt[] هي true، فسيتم إيقاف الموسيقى المشغلة سابقا.\nالتشغيل بموسيقى null مع تعيين interrupt إلى true سيوقف المقطع الحالي.\nلاحظ أن الموسيقى من حزم البيانات يجب أن تبدأ بالبادئة [accent]dp-[].
lst.makemarker = ينشئ علامة منطقية جديدة في العالم.\nيجب تقديم معرف لتمييز هذه العلامة.\nالعلامات محدودة حاليا بـ 20,000 لكل عالم.
lst.setmarker = يعين خاصية لعلامة.\nيجب أن يكون المعرف المستخدم مطابقا لما في تعليمة Make Marker.\nيتم تجاهل قيم [accent]null [].
lst.localeprint = يضيف قيمة خاصية من لغة الخريطة إلى مخزن النص.\nلتعيين حزم لغات الخريطة في محرر الخرائط، راجع [accent]معلومات الخريطة > حزم اللغات[].\nإذا كان العميل جهازا محمولا، فسيحاول طباعة خاصية تنتهي بـ ".mobile" أولا.
lst.query = يستعلم عن الوحدات/المباني في منطقة محددة.\nتخرج النتائج إلى [accent]@queries[].\nيمكن قراءة النتائج من [accent]@queries[] باستخدام تعليمة [accent]Read[] وفهرس.\nيمكن استشعار طول [accent]@queries[] باستخدام [accent]@size[] كمعامل.
lglobal.false = 0
lglobal.true = 1
lglobal.null = null
lglobal.@pi = الثابت الرياضي pi (3.141...)
lglobal.@e = الثابت الرياضي e (2.718...)
lglobal.@degToRad = اضرب بهذا الرقم لتحويل الدرجات إلى راديان
lglobal.@radToDeg = اضرب بهذا الرقم لتحويل الراديان إلى درجات
lglobal.@time = زمن اللعب في الحفظ الحالي، بالميلي ثانية
lglobal.@tick = زمن اللعب في الحفظ الحالي، بالنبضات (1 ثانية = 60 نبضة)
lglobal.@second = زمن اللعب في الحفظ الحالي، بالثواني
lglobal.@minute = زمن اللعب في الحفظ الحالي، بالدقائق
lglobal.@waveNumber = رقم الموجة الحالية، إذا كانت الموجات مفعلة
lglobal.@waveTime = مؤقت العد التنازلي للموجات، بالثواني
lglobal.@mapw = عرض الخريطة بالمربعات
lglobal.@maph = ارتفاع الخريطة بالمربعات
lglobal.sectionMap = الخريطة
lglobal.sectionGeneral = عام
lglobal.sectionNetwork = الشبكة/جهة العميل [معالج العالم فقط]
lglobal.sectionProcessor = المعالج
lglobal.sectionLookup = البحث
lglobal.@this = المبنى المنطقي الذي ينفذ الشيفرة
lglobal.@thisx = الإحداثي X للمبنى الذي ينفذ الشيفرة
lglobal.@thisy = الإحداثي Y للمبنى الذي ينفذ الشيفرة
lglobal.@links = العدد الإجمالي للمباني المرتبطة بهذا المعالج
lglobal.@ipt = سرعة تنفيذ المعالج بالتعليمات لكل نبضة (60 نبضة = 1 ثانية)
lglobal.@unitCount = العدد الإجمالي لأنواع محتوى الوحدات في اللعبة؛ يستخدم مع تعليمة lookup
lglobal.@blockCount = العدد الإجمالي لأنواع محتوى المباني في اللعبة؛ يستخدم مع تعليمة lookup
lglobal.@itemCount = العدد الإجمالي لأنواع محتوى العناصر في اللعبة؛ يستخدم مع تعليمة lookup
lglobal.@liquidCount = العدد الإجمالي لأنواع محتوى السوائل في اللعبة؛ يستخدم مع تعليمة lookup
lglobal.@server = true إذا كانت الشيفرة تعمل على خادم أو في اللعب الفردي، وfalse خلاف ذلك
lglobal.@client = true إذا كانت الشيفرة تعمل على عميل متصل بخادم
lglobal.@clientLocale = لغة العميل الذي ينفذ الشيفرة. مثال: en_US
lglobal.@clientUnit = وحدة العميل الذي ينفذ الشيفرة
lglobal.@clientName = اسم اللاعب للعميل الذي ينفذ الشيفرة
lglobal.@clientTeam = معرف فريق العميل الذي ينفذ الشيفرة
lglobal.@clientMobile = true إذا كان العميل الذي ينفذ الشيفرة على جهاز محمول، وfalse خلاف ذلك
lglobal.@clientMusicPlaying = true إذا كانت هناك أي موسيقى قيد التشغيل حاليا
lglobal.@clientCurrentMusic = اسم المقطع الحالي قيد التشغيل، أو null
lenum.type = نوع المبنى/الوحدة.\nمثلا لأي موزع، سيعيد [accent]@router[].\nليس سلسلة نصية.
lenum.shoot = يطلق النار على موقع.
