hint.unitSelectControl.mobile = للتحكم بالوحدات، ادخل [accent]وضع الأوامر[] بالضغط على زر [accent]الأوامر[] في أسفل اليسار.\nفي وضع الأوامر، اضغط مطولا واسحب لتحديد الوحدات. المس موقعا أو هدفا لتأمر الوحدات بالتوجه إليه.
hint.launch = بعد جمع موارد كافية، يمكنك [accent]الإطلاق[] إلى القطاع التالي بفتح :map: [accent]الخريطة[] في أسفل اليمين والانتقال إلى الموقع الجديد.
hint.launch.mobile = بعد جمع موارد كافية، يمكنك [accent]الإطلاق[] باختيار قطاعات مجاورة من :map: [accent]الخريطة[] في :menu: [accent]القائمة[].
hint.schematicSelect = اضغط مطولا على [accent][[F][] واسحب لتحديد المباني لنسخها ولصقها.\n\n[accent][[Middle Click][] لنسخ نوع مبنى واحد.
hint.rebuildSelect = اضغط مطولا على [accent][[B][] واسحب لتحديد مخططات المباني المدمرة.\nسيعيد ذلك بناءها تلقائيا.
hint.rebuildSelect.mobile = اختر زر النسخ :copy:، ثم المس زر إعادة البناء :wrench: واسحب لتحديد مخططات المباني المدمرة.\nسيعيد ذلك بناءها تلقائيا.
