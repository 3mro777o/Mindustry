locales.info = هنا يمكنك إضافة حزم لغات للغات محددة إلى خريطتك. في حزم اللغات، لكل خاصية اسم وقيمة. يمكن لمعالجات العالم والأهداف استخدام هذه الخصائص عبر أسمائها. وهي تدعم تنسيق النص (استبدال العناصر النائبة بالقيم الفعلية).\n\n[cyan]مثال على خاصية:\n[]الاسم: [accent]timer[]\nالقيمة: [accent]مؤقت تجريبي، الوقت المتبقي: {0}[]\n\n[cyan]الاستخدام:\n[]عينها كنص للهدف: [accent]@timer\n\n[]اطبعها في معالج عالم:\n[accent]localeprint "timer"\nformat time\n[gray](حيث time متغير يحسب بشكل منفصل)
