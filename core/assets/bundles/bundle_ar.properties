hint.blockInfo = اعرض العناصر المطلوبة وإحصائيات المبنى باختياره في [accent]قائمة البناء[]، ثم اختر زر [accent][[?][] على اليمين.
hint.derelict = المباني [accent]المهجورة[] هي بقايا محطمة لقواعد قديمة لم تعد تعمل.\n\nيمكن [accent]تفكيك[] هذه المباني للحصول على الموارد، أو إصلاحها.
hint.research = استخدم زر :tree: [accent]الأبحاث[] لبحث تقنيات جديدة.
hint.research.mobile = استخدم زر :tree: [accent]الأبحاث[] في :menu: [accent]القائمة[] لبحث تقنيات جديدة.
hint.unitControl = اضغط مطولا على [accent][[L-ctrl][] و[accent]انقر[] للتحكم يدويا بالوحدات أو الأبراج الصديقة.
