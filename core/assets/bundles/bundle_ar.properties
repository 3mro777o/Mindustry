sector.onset.description = ابدأ غزو إيريكير. اجمع الموارد، وأنتج الوحدات، وابدأ بحث التقنيات.
sector.aegis.description = يحتوي هذا القطاع على رواسب من التنغستن.\nابحث [accent]مثقاب الاصطدام[] لتعدين هذا المورد، ودمر قاعدة العدو في المنطقة.
sector.lake.description = بحيرة الخبث في هذا القطاع تحد كثيرا من الوحدات الصالحة. الوحدة الحائمة هي الخيار الوحيد.\nابحث [accent]مصنع السفن[] وأنتج وحدة [accent]إيلود[] بأسرع ما يمكن.
sector.intersect.description = تشير عمليات المسح إلى أن هذا القطاع سيهاجم من عدة جهات بعد الهبوط بوقت قصير.\nجهز الدفاعات بسرعة وتوسع بأسرع ما يمكن.\nستحتاج إلى وحدات [accent]الآليات[] لتضاريس المنطقة الوعرة.
sector.atlas.description = يحتوي هذا القطاع على تضاريس متنوعة وسيتطلب مجموعة متنوعة من الوحدات للهجوم بفعالية.\nقد تحتاج أيضا إلى وحدات مطورة لتجاوز بعض قواعد العدو المرصودة هنا.\nابحث [accent]المحلل الكهربائي[] و[accent]معيد تصنيع الدبابات[].
sector.split.description = الوجود الضئيل للعدو في هذا القطاع يجعله مثاليا لاختبار تقنيات النقل الجديدة.
sector.basin.description = رصد وجود كبير للعدو في هذا القطاع.\nابنِ الوحدات بسرعة واستول على أنوية العدو لتثبيت موطئ قدم.
sector.marsh.description = يزخر هذا القطاع بالأركيسايت، لكن فتحاته محدودة.\nابنِ [accent]غرفة الاحتراق الكيميائي[] لتوليد الطاقة.
sector.peaks.description = التضاريس الجبلية في هذا القطاع تجعل معظم الوحدات عديمة الفائدة. ستحتاج إلى وحدات طائرة.\nاحذر من منشآت العدو المضادة للطائرات. قد يمكن تعطيل بعض هذه المنشآت باستهداف المباني الداعمة لها.
sector.ravine.description = طريق نقل مهم للعدو. لم ترصد أي أنوية في القطاع، لكن توقع قوات معادية متنوعة.\nأنتج [accent]سبيكة الاندفاع[]. ابنِ أبراج [accent]أفليكت[].
sector.caldera-erekir.description = الموارد المرصودة في هذا القطاع موزعة على عدة جزر.\nابحث النقل بالطائرات المسيرة وانشره.
sector.stronghold.description = يحرس معسكر العدو الكبير في هذا القطاع رواسب كبيرة من [accent]الثوريوم[].\nاستخدمه لتطوير وحدات وأبراج من فئات أعلى.
sector.crevice.description = سيرسل العدو قوات هجومية شرسة للقضاء على قاعدتك في هذا القطاع.\nقد يكون تطوير [accent]الكاربيد[] و[accent]مولد التحلل الحراري[] ضروريا للبقاء.
sector.siege.description = يضم هذا القطاع واديين متوازيين سيفرضان هجوما من جبهتين.\nابحث [accent]السيانوجين[] لتكتسب القدرة على صنع وحدات دبابات أقوى.\nتنبيه: رصدت صواريخ بعيدة المدى للعدو. يمكن إسقاط الصواريخ قبل ارتطامها.
sector.crossroads.description = أقيمت قواعد العدو في هذا القطاع على تضاريس متنوعة. ابحث وحدات مختلفة للتكيف.\nإضافة إلى ذلك، بعض القواعد محمية بدروع واقية. اكتشف كيف تزود بالطاقة.
sector.karst.description = هذا القطاع غني بالموارد، لكن العدو سيهاجمه فور هبوط نواة جديدة.\nاستفد من الموارد وابحث [accent]نسيج الطور[].
sector.origin.description = القطاع الأخير الذي يشهد وجودا كبيرا للعدو.\nلم تتبق فرص بحث محتملة - ركز فقط على تدمير كل أنوية العدو.
