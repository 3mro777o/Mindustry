sector.groundZero.description = الموقع المثالي للبدء من جديد. تهديد منخفض من الأعداء. موارد قليلة.\n\nاجمع أكبر قدر ممكن من الرصاص والنحاس.\nثم تابع التقدم.
sector.frozenForest.description = حتى هنا، بالقرب من الجبال، انتشرت الأبواغ. لن تتمكن درجات الحرارة القارسة من احتوائها إلى الأبد.\n\nابدأ رحلتك مع الطاقة. ابنِ مولدات الاحتراق. تعلم استخدام المصلحات.
sector.saltFlats.description = على أطراف الصحراء تقع السباخ الملحية. يمكن العثور على موارد قليلة في هذا الموقع.\n\nأقام العدو هنا مجمعا لتخزين الموارد. دمر نواتهم. لا تترك شيئا قائما.
sector.crateredBattleground.description = تجمعت المياه في هذه الفوهة، أثر من الحروب القديمة. استعد المنطقة. اجمع الرمل. اصهر الزجاج المعدني. ضخ الماء لتبريد الأبراج والمثاقب.
sector.ruinousShores.description = بعد الأراضي القاحلة يأتي خط الساحل. كان هذا الموقع يضم يوما منظومة دفاع ساحلية. لم يبق منها الكثير. وحدها أبسط المنشآت الدفاعية بقيت سليمة، وتحول كل ما عداها إلى خردة.\n\nواصل التوسع نحو الخارج. أعد اكتشاف التقنية.
sector.stainedMountains.description = في عمق اليابسة تقع الجبال، التي لم تلوثها الأبواغ بعد.\nاستخرج التيتانيوم الوفير في هذه المنطقة. تعلم كيف تستخدمه.\n\nوجود العدو أكبر هنا. لا تمنحهم الوقت لإرسال أقوى وحداتهم.
sector.overgrowth.description = هذه المنطقة مكتظة بالنباتات، وأقرب إلى منشأ الأبواغ.\n\nأقام العدو موقعا متقدما هنا. ابنِ وحدات مايس. دمره.
sector.tarFields.description = أطراف منطقة لإنتاج النفط، بين الجبال والصحراء. إحدى المناطق القليلة التي تحوي احتياطيات قطران قابلة للاستخدام.\nرغم أنها مهجورة، توجد قوات معادية خطرة بالقرب من هذه المنطقة. لا تستهن بها.\n\nابحث تقنية معالجة النفط إن أمكن.
sector.desolateRift.description = منطقة خطرة للغاية. موارد وفيرة، لكن المساحة ضيقة. خطر الدمار مرتفع.\n\nابنِ دفاعات جوية وأرضية بأسرع ما يمكن. لا تنخدع بقلة هجمات العدو.
sector.nuclearComplex.description = منشأة سابقة لإنتاج الثوريوم ومعالجته، تحولت إلى أطلال.\nابحث مفاعل ثوريوم، واستخدمه لتوليد طاقة متقدمة.\n\nالعدو موجود هنا بأعداد كبيرة، ويستطلع باستمرار بحثا عن المهاجمين.
sector.fungalPass.description = منطقة انتقالية بين الجبال العالية والأراضي المنخفضة الموبوءة بالأبواغ. توجد هنا قاعدة استطلاع صغيرة للعدو.\n\nاستخدم وحدات داغر. دمر موقع العدو المتقدم.
sector.biomassFacility.description = منشأ الأبواغ. هذه هي المنشأة التي جرى فيها بحثها وإنتاجها أول مرة.\nابحث التقنية الموجودة فيها. استزرع الأبواغ لإنتاج الوقود والبلاستيك.\n\n[lightgray]عند انهيار هذه المنشأة، تحررت الأبواغ. لم يستطع أي شيء في النظام البيئي المحلي منافسة كائن مجتاح كهذا.
sector.windsweptIslands.description = أبعد من خط الساحل تقع هذه السلسلة النائية من الجزر. تظهر السجلات أنها احتوت يوما على منشآت تنتج البلاستانيوم.\n\nصد وحدات العدو البحرية. أنشئ قاعدة على الجزر. ابحث هذه المصانع.
sector.extractionOutpost.description = موقع متقدم ناء، شيده العدو لإطلاق الموارد إلى قطاعات أخرى.\n\nتقنية النقل بين القطاعات ضرورية لمزيد من الغزو. دمر القاعدة. ابحث منصات الإطلاق الخاصة بهم.
sector.impact0078.description = هنا تقبع بقايا سفينة النقل بين النجمية التي دخلت هذا النظام أول مرة.\n\nانتشل أكبر قدر ممكن من الحطام. ابحث أي تقنية سليمة.
sector.planetaryTerminal.description = الهدف النهائي.\n\nتحتوي هذه القاعدة الساحلية على منشأة قادرة على إطلاق الأنوية إلى الكواكب المجاورة. وهي محصنة بشدة.\n\nأنتج وحدات بحرية. اقض على العدو بأسرع ما يمكن. ابحث منشأة الإطلاق.
sector.coastline.description = رصدت في هذا الموقع بقايا تقنية لتصنيع السبائك.\n\nصد هجمات العدو، واستول على هذا القطاع، واحصل على التقنية.
sector.navalFortress.description = أقام العدو قاعدة على جزيرة نائية محصنة طبيعيا. دمر هذا الموقع المتقدم. احصل على تقنية سفنهم البحرية المتقدمة، وابحثها.
sector.facility32m.description = يحتوي هذا القطاع على البقايا المتهالكة لمنشأة إنتاج متفجرات.\n\nاستول على هذه المنطقة. ابحث خلاط المتفجرات. أنتج المركب المتفجر لاستخدامه ذخيرة للأبراج.
sector.taintedWoods.description = [gray][هدف اختياري][]\nهذا القطاع غني باحتياطيات النفط، ويحتوي على كتل ضخمة من النمو الفطري تجعل اجتيازه صعبا.\n\nاستخدم موارده لإنتاج البلاستانيوم. صد العدو.
sector.sunkenPier.description = [gray][هدف اختياري][]\nكانت هذه المنشأة يوما منصة نفط بحرية، لكنها تهالكت منذ زمن طويل.\n\nرصدت أعداد كبيرة من وحدات العدو البحرية. استعد لهجمات من عدة اتجاهات.
sector.atolls.description = [gray][هدف اختياري][]\nرصدت عدة قواعد بحرية للعدو في هذا الموقع.\n\nاستخدم وحدات الحمولة ميغا لنقل القوات الأرضية إلى مواقع الهجوم. ابنِ وحدات بحرية لتدمير المواقع المتقدمة الطرفية.
sector.frontier.description = رصد موقع متقدم صغير للعدو هنا.\n\nابنِ وحدات مونو لجمع الموارد بفعالية أكبر. استخدم معيد بناء إضافي لصنع وحدات أقوى.
sector.infestedCanyons.description = خلف الجبال يقع واد نهري متعرج، تغطيه الآن طبقات من طحلب الأبواغ.\n\nاثبت في مواجهة هجوم العدو الكاسح. ابنِ وحدات بحرية. اقض على كل أنوية العدو.
sector.testingGrounds.description = [gray][هدف اختياري][]\nواد صحراوي مليء بالفوهات، استخدم سابقا ميدانا لاختبار المشاريع العسكرية.\n\nبسبب نقص المياه، قد يكون ترسيخ وجودك في هذا الموقع تحديا. استعد لهجمات من عدة اتجاهات.
sector.perilousHarbor.description = أقيمت عدة قواعد للعدو عبر هذه المنطقة الساحلية الغادرة.\n\nابنِ وحدات بحرية، وحطم تحصيناتهم.
sector.weatheredChannels.description = [gray][هدف اختياري][]\nيضم نظام القنوات هذا موارد وفيرة. أنزل نواتك. صد موجات العدو للاستيلاء عليها.\n\nسيسلك العدو عدة طرق لمهاجمة بنيتك التحتية. ابحث عن علامات كمين محتمل ودافع وفقا لذلك.
sector.mycelialBastion.description =  يقع هذا المجمع المحصن في أعماق المناطق الفطرية، ويهدد القطاعات المجاورة بوحدات حشرية متقدمة.\n\nهاجم المجمع. احصل على التقنية الموجودة فيه. استخدم وحدات قادرة على عبور الجدران.
sector.littoralShipyard.description = تقع منشأة الإنتاج البحري هذه في الأطراف البعيدة للبحر الأوسط، وتحتوي على تقنية لبناء وحدات متقدمة.\n\nدمر هذه المنشأة، واستخدم تقنيتها للمساعدة في إنجاز الهدف النهائي.
